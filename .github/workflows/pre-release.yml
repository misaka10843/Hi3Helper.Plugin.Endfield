name: Pre-Release Plugins

on:
  workflow_dispatch:
    inputs:
      plugin_selection:
        description: 'Plugin to include in pre-release'
        required: true
        default: 'all'
        type: choice
        options: [ all, Hi3Helper.Plugin.Endfield, Hi3Helper.Plugin.Arknights ]
      endfield_version:
        description: 'Endfield pre-release version (e.g. 0.1.2-pre.1)'
        default: ''
        type: string
      arknights_version:
        description: 'Arknights pre-release version (e.g. 0.1.0-pre.1)'
        default: ''
        type: string
      publish_profile:
        description: 'Publish profile to use'
        required: true
        type: choice
        options:
          - ReleaseNoReflectionPublish-O1
          - ReleaseNoReflectionPublish-O2
          - ReleasePublish-O1
          - ReleasePublish-O2
          - DebugPublish
          - DebugNoReflectionPublish
        default: ReleaseNoReflectionPublish-O1
      release_tag:
        description: 'Rolling pre-release tag name (reused on every run)'
        default: 'pre-release'
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

# Only one rolling pre-release run at a time; a newer run cancels the older one
# so the delete-and-recreate step never races with itself.
concurrency:
  group: pre-release
  cancel-in-progress: true

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          END_VER="${{ github.event.inputs.endfield_version }}"
          ARK_VER="${{ github.event.inputs.arknights_version }}"
          SELECT="${{ github.event.inputs.plugin_selection }}"

          RESULT="[]"
          if [[ ("$SELECT" == "all" || "$SELECT" == "Hi3Helper.Plugin.Endfield") && -n "$END_VER" ]]; then
            RESULT=$(echo $RESULT | jq -c '. += [{"name": "Hi3Helper.Plugin.Endfield", "short": "Endfield", "version": "'$END_VER'"}]')
          fi
          if [[ ("$SELECT" == "all" || "$SELECT" == "Hi3Helper.Plugin.Arknights") && -n "$ARK_VER" ]]; then
            RESULT=$(echo $RESULT | jq -c '. += [{"name": "Hi3Helper.Plugin.Arknights", "short": "Arknights", "version": "'$ARK_VER'"}]')
          fi

          echo "matrix=$RESULT" >> $GITHUB_OUTPUT

  build:
    needs: prepare_release
    if: needs.prepare_release.outputs.matrix != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prepare_release.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.item.name }}/${{ matrix.item.name }}.csproj

      - name: Build project
        run: dotnet build --configuration Release ${{ matrix.item.name }}/${{ matrix.item.name }}.csproj --no-restore /p:Version=${{ matrix.item.version }}

      - name: Publish with selected profile
        run: dotnet publish ${{ matrix.item.name }}/${{ matrix.item.name }}.csproj --configuration Release --runtime win-x64 /p:PublishProfile=${{ github.event.inputs.publish_profile }} /p:Version=${{ matrix.item.version }} -o ./publish_output

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: './publish_output/**'

      # Indexer generates the .br files and the plugin zip inside ./publish_output
      - name: Run Indexer
        run: .\Indexer.exe .\publish_output

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ matrix.item.short }}@v${{ matrix.item.version }} --strip header
        id: git-cliff

      - name: Save Changelog
        shell: bash
        run: |
          cat > ./changelog_${{ matrix.item.short }}.md <<'EOF'
          ${{ steps.git-cliff.outputs.content }}
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.item.short }}-pre
          path: |
            ./publish_output/*.zip
            ./changelog_${{ matrix.item.short }}.md

  create_prerelease:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Combine changelogs
        shell: bash
        run: |
          cat ./artifacts/changelog_*.md > ./RELEASE_NOTES.md
          if [ ! -s ./RELEASE_NOTES.md ]; then
            echo "Pre-release build." > ./RELEASE_NOTES.md
          fi

      # Rolling pre-release: delete the previous release (and its tag) so the
      # same tag/name is reused and no extra pre-releases pile up.
      - name: Delete existing rolling pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.event.inputs.release_tag }}" --yes --cleanup-tag || true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Plugins Pre-Release
          body_path: ./RELEASE_NOTES.md
          prerelease: true
          files: |
            ./artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
