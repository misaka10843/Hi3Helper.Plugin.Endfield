# git-cliff configuration for Hi3Helper.Plugin.Hypergryph
# Docs: https://git-cliff.org
#
# Release workflow passes `--tag <Plugin>@v<version>` (e.g. Endfield@v0.1.2),
# so the tag pattern matches `*@v*`.

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\{% if commit.breaking %}[**breaking**] {% endif %}\{{ commit.message | upper_first }}
    {% endfor %}
{% endfor %}\n
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# postprocessors: remove trailing parenthesized notes from commit messages
postprocessors = [
  { pattern = '\(.*\)', replace = "" },
]

[git]
# parse commits based on https://www.conventionalcommits.org
conventional_commits = true
# only include commits that are conventional
filter_unconventional = true
# do not drop commits that no parser matched
filter_commits = false
# glob pattern for matching git tags (e.g. Endfield@v0.1.2, Arknights@v0.1.0)
tag_pattern = "*@v*"
# sort the commits inside sections from oldest to newest
sort_commits = "oldest"
# commit grouping rules (order matters: first match wins)
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^revert", group = "Revert" },
  { message = ".*", group = "Other" },
]
# never let a breaking change be skipped by a skip parser
protect_breaking_commits = false
